# Production compose — Caddy terminates HTTPS/WSS, no source mounts, multi-worker.
# Usage: docker compose -f docker-compose.prod.yml up --build -d
#
# Required env in a .env alongside this file:
#   APP_DOMAIN        e.g. app.yourvenue.ng   (frontend)
#   API_DOMAIN        e.g. api.yourvenue.ng   (backend — Paystack webhook lives here)
#   SECRET_KEY, POSTGRES_PASSWORD, ALLOWED_ORIGINS (https://$APP_DOMAIN)
#   PUBLIC_API_URL    https://$API_DOMAIN/api/v1
#   PUBLIC_WS_URL     wss://$API_DOMAIN
# Optional: PAYSTACK_SECRET_KEY, SENTRY_DSN
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN}
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: easyserve
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: easyserve
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easyserve"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://easyserve:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/easyserve
      REDIS_URL: redis://redis:6379
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      ENVIRONMENT: production
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?set ALLOWED_ORIGINS}
      FRONTEND_URL: https://${APP_DOMAIN:?set APP_DOMAIN}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/workspace/backend/static
    # --proxy-headers trusts X-Forwarded-* from Caddy; safe because the backend
    # is only reachable through the docker network (no published ports).
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4 --proxy-headers --forwarded-allow-ips '*'"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:?set PUBLIC_API_URL}
        NEXT_PUBLIC_WS_URL: ${PUBLIC_WS_URL:?set PUBLIC_WS_URL}
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
