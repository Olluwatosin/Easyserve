# Keeps the free demo backend warm. Resets the seeded venue only when asked.
#
# The reset used to run hourly. It deletes every row in every table — users and
# venues included — and rebuilds the demo venue, which is right for a sales demo
# and catastrophic for anything else: an account handed to a tester stopped
# working within the hour, along with every order they had entered. Real people
# are testing on this deployment now, so the schedule is gone and the reset is
# manual: Actions → Demo keepalive → Run workflow → tick "Also reset".
#
# Free tiers sleep after ~15 minutes idle and take 30-60s to wake. A venue owner
# who opens the demo link and watches a spinner has already formed an opinion,
# so we ping /health often enough that it never sleeps.
#
# Requires two repository variables/secrets:
#   vars.DEMO_API_URL         e.g. https://easyserve-demo-api.onrender.com
#   secrets.DEMO_RESET_TOKEN  must match the backend's DEMO_RESET_TOKEN
name: Demo keepalive

on:
  schedule:
    - cron: "*/10 * * * *"   # keep warm only — no reseed on a schedule
  workflow_dispatch:
    inputs:
      reset:
        description: "DESTRUCTIVE — wipes every venue, user and order, then reseeds the demo"
        type: boolean
        default: false

concurrency:
  group: demo-keepalive
  cancel-in-progress: false

jobs:
  ping:
    name: Ping /health
    runs-on: ubuntu-latest
    steps:
      - name: Wake the demo backend
        env:
          API: ${{ vars.DEMO_API_URL }}
        run: |
          # Strip whitespace and any trailing slash. A value pasted into the
          # GitHub UI very easily picks up a leading space, and curl rejects the
          # result outright ("URL rejected: Malformed input") without ever making
          # a request — which looks identical to the service being down.
          API=$(printf '%s' "$API" | tr -d '[:space:]' | sed 's:/*$::')
          if [ -z "$API" ]; then
            echo "::error::DEMO_API_URL repository variable is not set"
            exit 1
          fi
          echo "Pinging: [$API/health]"

          # ── One patient probe, not a retry loop ────────────────────────────
          #
          # This used to fire five attempts 120s apart, and on a sleeping
          # instance that made things worse rather than better. The first request
          # starts Render provisioning the container; every request piled on
          # behind it while that was still happening came back 429 from Render's
          # edge. The job then declared the backend unhealthy — about a service
          # that was merely asleep and answered fine moments later. One false
          # alarm at 9:56pm is how a monitor teaches you to ignore it.
          #
          # Two cold starts can stack: Render waking the container (~35-55s) and
          # Neon waking the branch from scale-to-zero on the first query. So the
          # budget is generous and the gaps are wide enough that the container
          # has genuinely finished starting before anything else is sent.
          probe() {
            # The response body is cleared first. curl leaves the previous one in
            # place when it cannot connect, which put a healthy {"status":"ok"}
            # in the log directly above an error about the service being down.
            rm -f /tmp/health.json
            # curl itself prints 000 through -w when it never got a response, so
            # `|| echo 000` on top of that produced "HTTP 000000". The guard is
            # only for a curl that fails before writing anything at all.
            local out
            out=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 180 "$API/health" 2>/dev/null) || true
            printf '%s' "${out:-000}"
          }

          started=$(date +%s)
          code=$(probe)
          if [ "$code" != "200" ]; then
            echo "First probe: HTTP $code - waiting 45s for the container to finish starting"
            sleep 45
            code=$(probe)
          fi
          if [ "$code" != "200" ]; then
            echo "Second probe: HTTP $code - one last try in 60s"
            sleep 60
            code=$(probe)
          fi
          took=$(( $(date +%s) - started ))

          cat /tmp/health.json 2>/dev/null || true
          echo

          # ── What counts as a problem ───────────────────────────────────────
          #
          # 200 after a long wait means it was asleep and is now awake. On a free
          # instance that is the expected state rather than a fault, so it does
          # not fail the job — but it is still said out loud, because a tester
          # hitting that same cold start waits the same 50 seconds and concludes
          # the product is slow.
          #
          # 503 is the one that matters: the app is answering but cannot reach
          # Postgres. That is a broken demo and it will not fix itself.
          if [ "$code" = "200" ]; then
            if [ "$took" -gt 20 ]; then
              echo "::warning::Demo was asleep - took ${took}s to answer. A tester hitting it cold waits the same. GitHub fires this schedule every few hours rather than every 10 minutes, so it cannot keep the instance warm; a paid instance or an external 5-minute pinger is the actual fix."
            else
              echo "Awake and warm (${took}s)"
            fi
            exit 0
          fi

          if [ "$code" = "503" ]; then
            echo "::error::Demo backend is up but its database is unreachable (HTTP 503)"
            exit 1
          fi

          echo "::error::Demo backend did not answer after ${took}s (last: HTTP $code)"
          exit 1

  reset:
    name: Reseed the demo venue
    runs-on: ubuntu-latest
    needs: ping
    # Manual only. The hourly schedule that used to trigger this is deliberately
    # gone — see the note at the top of this file.
    if: inputs.reset
    steps:
      - name: Wipe and re-seed The Grand Noir
        env:
          API: ${{ vars.DEMO_API_URL }}
          TOKEN: ${{ secrets.DEMO_RESET_TOKEN }}
        run: |
          API=$(printf '%s' "$API" | tr -d '[:space:]' | sed 's:/*$::')
          TOKEN=$(printf '%s' "$TOKEN" | tr -d '[:space:]')
          if [ -z "$TOKEN" ]; then
            echo "::error::DEMO_RESET_TOKEN secret is not set"
            exit 1
          fi
          code=$(curl -sS -X POST -o /tmp/reset.json -w '%{http_code}' --max-time 180 \
            -H "X-Demo-Token: $TOKEN" "$API/api/v1/demo/reset") || true
          echo "HTTP $code"
          cat /tmp/reset.json 2>/dev/null || true
          echo
          # A 404 here means the backend refused: either ENVIRONMENT is not "demo"
          # or the token doesn't match. Both are misconfiguration, not transient.
          if [ "$code" = "404" ]; then
            echo "::error::Reset refused. Check ENVIRONMENT=demo and that DEMO_RESET_TOKEN matches."
            exit 1
          fi
          if [ "$code" != "200" ]; then
            echo "::error::Demo reset failed (HTTP $code)"
            exit 1
          fi
