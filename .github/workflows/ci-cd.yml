name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Backend ────────────────────────────────────────────────────────────────
  backend:
    name: Backend — test
    runs-on: ubuntu-latest

    # Real Postgres and Redis so integration tests can exercise the money path
    # (webhook -> payment -> exit pass) rather than only pure units.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: easyserve
          POSTGRES_PASSWORD: easyserve
          POSTGRES_DB: easyserve_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U easyserve"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://easyserve:easyserve@localhost:5432/easyserve_test
      REDIS_URL: redis://localhost:6379
      SECRET_KEY: ci-secret-key-that-is-at-least-32-characters-long
      ENVIRONMENT: development

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      # `uv run pytest` resolves pytest from PATH, which silently picks up a
      # shadowing system interpreter. `python -m` pins it to the project venv.
      - name: Run tests
        run: uv run python -m pytest -v
        working-directory: backend

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    name: Frontend — lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
          NEXT_PUBLIC_WS_URL: ws://localhost:8000

  # ── Deploy (main only) ─────────────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.VPS_PATH }}
            git pull origin main
            # Secrets (SECRET_KEY, POSTGRES_PASSWORD, PUBLIC_API_URL, PUBLIC_WS_URL,
            # ALLOWED_ORIGINS) are read from a .env file kept on the VPS next to the compose file.
            docker compose -f docker-compose.prod.yml up --build -d
            docker system prune -f
